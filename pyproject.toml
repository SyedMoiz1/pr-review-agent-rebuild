[project]
name = "pr-review-agent-rebuild"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Syed Moiz", email = "syedmoiz619@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ruff>=0.16.3",
    "fastapi",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "httpx>=0.28.1",
    "asyncpg>=0.31.0",
    "uvicorn>=0.53.0",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "arq>=0.28.0",
]

[project.scripts]
pr-review-agent-rebuild = "pr_review_agent_rebuild:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.mypy]
strict = true
files = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
